esphome:
  name: shruberry
  comment: Soil and air monitor node
  friendly_name: Shruberry

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  cpu_frequency: 160MHz
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "RdF1G7t8J7YeDF7+U37MlYBPoCRI7uNhtiTiJ7lXKgE="

ota:
  - platform: esphome
    password: "0afd624b144523bce53f36563bb89966"

# WiFi configuration with fallback mechanisms
wifi:
  ssid: "AleoExpress"
  password: Engenharia01
  ap:
    ssid: "Shruberry_AP"
    password: ""

# Add captive portal for AP mode
captive_portal:

# Enable web server for status page
web_server:
  port: 80
  local: true
  version: 3

# Define I2C bus
i2c:
  id: bus_i2c
  sda: GPIO7
  scl: GPIO8
  scan: true
  frequency: 400kHz

#MARK: Buttons
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Button A"
    id: button_a
    icon: mdi:gesture-tap
    on_press:
      - logger.log: "Button A pressed"

switch:
  - platform: factory_reset
    name: Restart with Factory Default Settings
  #MARK: Relay Enable
  - platform: gpio
    pin: GPIO2
    name: "Relay Enable"
    id: relay_switch
    device_class: switch
    icon: mdi:power-plug
    restore_mode: RESTORE_DEFAULT_OFF
  #MARK: Schedule Toggle
  - platform: template
    name: "Outlet 1 Schedule Enabled"
    id: outlet1_schedule_enabled
    icon: mdi:calendar-clock
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  #MARK: Relays
  - platform: gpio
    id: relay0
    name: "Outlet 1"
    device_class: outlet
    icon: "mdi:power-socket-ch"
    internal: false
    restore_mode: RESTORE_DEFAULT_OFF
    pin: GPIO0
  - platform: gpio
    id: relay1
    name: "Outlet 2"
    device_class: outlet
    icon: "mdi:power-socket-ch"
    internal: false
    restore_mode: RESTORE_DEFAULT_OFF
    pin: GPIO1

# Status sensors
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: adc
    pin: GPIO4
    name: "Soil"
    update_interval: 10s
    attenuation: 11db
    #filters:
    #  - multiply: 3.3

# Define text sensors for device status
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    bssid:
      name: "Connected BSSID"
      internal: true
    mac_address:
      name: "MAC Address"
      internal: true

# Define buttons for device control
button:
  - platform: restart
    name: "Restart Node"

# Add a time component to keep track of time
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - logger.log: "Time synchronized with Home Assistant"
    on_time:
      #MARK: Outlet 1 Schedule — fires every minute
      - seconds: 0
        minutes: "*"
        hours: "*"
        then:
          - lambda: |-
              if (!id(outlet1_schedule_enabled).state) return;
              auto t = id(homeassistant_time).now();
              if (!t.is_valid()) return;
              int on_h = 0, on_m = 0, off_h = 0, off_m = 0;
              sscanf(id(outlet1_on_time).state.c_str(),  "%d:%d", &on_h,  &on_m);
              sscanf(id(outlet1_off_time).state.c_str(), "%d:%d", &off_h, &off_m);
              if (t.hour == on_h && t.minute == on_m) {
                id(relay0).turn_on();
                ESP_LOGI("schedule", "Outlet 1 turned ON at %d:%02d", t.hour, t.minute);
              }
              if (t.hour == off_h && t.minute == off_m) {
                id(relay0).turn_off();
                ESP_LOGI("schedule", "Outlet 1 turned OFF at %d:%02d", t.hour, t.minute);
              }

#MARK: Outlet 1 Schedule Configuration
text:
  - platform: template
    name: "Outlet 1 Turn On Time"
    id: outlet1_on_time
    mode: text
    max_length: 5
    initial_value: "06:00"
    restore_value: true
    optimistic: true
    icon: mdi:clock-start
  - platform: template
    name: "Outlet 1 Turn Off Time"
    id: outlet1_off_time
    mode: text
    max_length: 5
    initial_value: "22:00"
    restore_value: true
    optimistic: true
    icon: mdi:clock-end

# Add persistent storage for configuration
globals:
  - id: config_version
    type: int
    restore_value: yes
    initial_value: "1"
